version: '3.8'

# این نسخه اصلاح شده از ایمیج استاندارد وردپرس استفاده می‌کند که شامل وب سرور است.
# این کار مشکل "Failed" شدن نصب را حل می‌کند.

services:
  db:
    image: mysql:8.0
    container_name: premiumgift_db
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: your_strong_root_password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: your_strong_wordpress_password
    networks:
      - wpsite

  wordpress:
    image: wordpress:latest  # استفاده از ایمیج استاندارد و کامل وردپرس
    container_name: premiumgift_wp
    depends_on:
      - db
    ports:
      - "8000:80" # پورت ۸۰ کانتینر به پورت ۸۰۰۰ سیستم شما متصل می‌شود
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: your_strong_wordpress_password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./wp-content:/var/www/html/wp-content
    networks:
      - wpsite

volumes:
  db_data:

networks:
  wpsite:
    driver: bridge